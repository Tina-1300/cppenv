name: CI - Windows

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'bugfix/**'
      - 'refact/**'
      - 'refactor/**'
      - 'hotfix/**'
      - 'test/**'
      - 'tests/**'
      - 'ci/**'
      - 'chore/**'

  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: windows-2025-vs2026

    strategy:
      fail-fast: false
      matrix:
        preset:
          - windows-clang-debug
          - windows-clang-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake via Presets
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }}

      - name: Build via Presets
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.preset }}

      - name: Test via Presets
        shell: pwsh
        run: |
          ctest --preset ${{ matrix.preset }}