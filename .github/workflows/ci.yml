name: CI - Multi-OS Unit Tests

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'bugfix/**'
      - 'refact/**'
      - 'refactor/**'
      - 'hotfix/**'
      - 'test/**'
      - 'tests/**'
      - 'ci/**'
      - 'chore/**'

  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ============================================================
          # Windows - Visual Studio 2026
          # ============================================================

          - os: windows-2025-vs2026
            platform: windows
            build_type: Debug

          - os: windows-2025-vs2026
            platform: windows
            build_type: Release

          # ============================================================
          # Linux - GCC
          # ============================================================

          - os: ubuntu-latest
            platform: linux
            build_type: Debug

          - os: ubuntu-latest
            platform: linux
            build_type: Release

          # ============================================================
          # macOS - Apple Clang
          # ============================================================

          - os: macos-latest
            platform: macos
            build_type: Debug

          - os: macos-latest
            platform: macos
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Windows - Visual Studio 2026
      # ============================================================

      - name: Configure CMake (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 18 2026" `
            -A x64

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake --build build `
            --config ${{ matrix.build_type }} `
            -- /m

      - name: Test (Windows)
        if: matrix.platform == 'windows'
        working-directory: build
        shell: pwsh
        run: |
          ctest `
            -C ${{ matrix.build_type }} `
            --output-on-failure

      # ============================================================
      # Linux - GCC
      # ============================================================

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure CMake (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic"

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake --build build -j 2

      - name: Test (Linux)
        if: matrix.platform == 'linux'
        working-directory: build
        run: |
          ctest --output-on-failure -j 2

      # ============================================================
      # macOS - Apple Clang
      # ============================================================

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install cmake

      - name: Configure CMake (macOS)
        if: matrix.platform == 'macos'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: |
          cmake --build build -j 2

      - name: Test (macOS)
        if: matrix.platform == 'macos'
        working-directory: build
        run: |
          ctest --output-on-failure -j 2